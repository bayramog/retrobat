name: macOS Feature
description: Plan or request a macOS Apple Silicon feature
title: "[macOS] "
labels: ["macos", "feature"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome is needed?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In-scope and out-of-scope items
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Clear, testable criteria
    validations:
      required: true
  - type: checkboxes
    id: governance
    attributes:
      label: Governance
      options:
        - label: Windows compatibility impact reviewed
        - label: macOS Apple Silicon target validated
        - label: Upstream PR is not part of this change
